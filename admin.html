<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Captcha Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="auth-container" class="admin-auth">
    <div class="auth-box">
      <h2>Admin Login</h2>
      <p>Log in to manage your packages and gallery.</p>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="button primary" style="width: 100%; justify-content: center;">Login</button>
        <p id="auth-error" class="error-text hidden"></p>
      </form>
    </div>
  </div>

  <div id="dashboard-container" class="admin-dashboard hidden">
    <header class="admin-header">
      <div class="brand">Smart Captcha Admin</div>
      <button id="logout-btn" class="button">Logout</button>
    </header>

    <main class="admin-main">
      <div class="tabs admin-tabs">
        <button class="tab active" data-target="gallery">Gallery</button>
        <button class="tab" data-target="packages">Packages</button>
        <button class="tab" data-target="settings">Settings / Tools</button>
      </div>

      <!-- GALLERY TAB -->
      <section id="gallery-tab" class="admin-section active">
        <div class="section-heading split">
          <h2>Gallery Images</h2>
          <div class="actions">
            <label class="button primary">
              Upload New Image
              <input type="file" id="upload-gallery-input" accept="image/*" hidden>
            </label>
          </div>
        </div>
        <p id="gallery-status" class="status-text"></p>
        <div id="admin-gallery-grid" class="admin-grid"></div>
      </section>

      <!-- PACKAGES TAB -->
      <section id="packages-tab" class="admin-section hidden">
        <div class="section-heading split">
          <h2>Manage Packages</h2>
          <button class="button primary" id="add-package-btn">Add Package</button>
        </div>
        <div id="admin-packages-list" class="admin-list"></div>
      </section>

      <!-- SETTINGS TAB -->
      <section id="settings-tab" class="admin-section hidden">
        <div class="section-heading">
          <h2>Admin Tools</h2>
        </div>
        <div class="tool-card">
          <h3>Seed Initial Data</h3>
          <p>Click this button once to automatically copy all your current hardcoded packages and gallery images into your new Supabase database.</p>
          <button class="button primary" id="seed-data-btn">Run Seed Script</button>
          <p id="seed-status" class="status-text"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="supabase-client.js"></script>
  <!-- Load the default data so the seed script can use it -->
  <script src="gallery-data.js"></script>
  <script src="script.js?v=11"></script> 
  <script src="admin.js?v=2"></script>
</body>
</html>
